; LocationGraphics.ini - per-location graphics overrides for Modern WoW Renderer.
;
; This file ships EMPTY on purpose. Every example below is commented out, so
; nothing in it changes the picture until you fill a value in. The renderer
; takes its shared baseline from GraphicsEffects.ini, and every value in this
; file is an override ON TOP of that baseline.
;
; -----------------------------------------------------------------------
; WHERE A VALUE COMES FROM
; -----------------------------------------------------------------------
; A setting is read from the most specific scope that holds it:
;
;   [Map.<map>.Zone.<zone>.Area.<area>.<Section>]  this subarea
;   [Map.<map>.Zone.<zone>.<Section>]              this zone
;   [Map.<map>.<Section>]                          this map
;   [<Section>] in GraphicsEffects.ini              the shared baseline
;
; The whole-game scope, [Global.<Section>], sits on top of all of them - but
; it does NOT silently override a zone you have tuned. A location takes a
; whole-game value only where it opts in, one setting at a time:
;
;   [Map.<map>.Zone.<zone>.InheritGlobal]
;   <Section>.<Key>=1
;
; Where a zone does not opt in, that setting keeps the zone's own value, or
; the baseline. Where the renderer cannot tell where you are at all, the
; whole-game scope answers instead of the baseline.
;
; F7's ALL TO GLOBAL switch temporarily masks Map/Zone/Area settings and uses
; the Global values (or GraphicsEffects.ini when no Global value exists). It
; does not rewrite or delete any location section; turning the switch off
; restores the values that were there before. The switch is saved as
; [Overlay] AllToGlobal=1 in this file.
;
; The location scopes are only read when the renderer knows where you are,
; which needs a verified client and data/areas.txt next to the DLL.
;
; -----------------------------------------------------------------------
; HOW TO FIND THE IDs
; -----------------------------------------------------------------------
; The F7 menu header shows the current Map, Zone and Area IDs, and
; data/areas.txt maps those numbers to names. Real examples:
;
;   Map 0, Zone 1        Dun Morogh
;   Map 0, Zone 33       Stranglethorn Vale
;   Map 0, Zone 33, Area 35   Booty Bay
;
; -----------------------------------------------------------------------
; WHICH SECTIONS YOU MAY USE
; -----------------------------------------------------------------------
;   Atmosphere        VolumetricClouds   Water         Underwater
;   LocalFog          WeatherVisuals      Wind         AmbientOcclusion
;   DynamicLighting   DistanceFog         NativeShadows
;
; The keys inside a section are the ones GraphicsEffects.ini uses, and the F7
; menu shows each key with its valid range. [PostProcess] is the exception:
; brightness, contrast, gamma and sharpness stay in GraphicsEffects.ini and
; are never overridden per location.
;
; -----------------------------------------------------------------------
; EXAMPLES
; -----------------------------------------------------------------------
; Every line of the blocks below starts with "; ;". Remove that prefix from
; the lines you want and delete the rest.
;
; A zone's own values - Map 0 / Zone 1 is Dun Morogh:
;
; ;[Map.0.Zone.1.Water]
; ;FoamEnabled=0
; ;ClarityPercent=140
;
; A subarea of that zone overriding it - Area 35 is Booty Bay, inside
; Stranglethorn Vale:
;
; ;[Map.0.Zone.33.Area.35.Water]
; ;FoamEnabled=1
;
; Another section of the same zone:
;
; ;[Map.0.Zone.33.Atmosphere]
; ;DensityPermille=7
;
; A whole-game value. It only reaches a zone that opts in, so it is left on
; its own here and picked up by the opt-in under it. FoamEnabled is not
; listed in the opt-in, so the zone keeps its own foam setting:
;
; ;[Global.Water]
; ;ClarityPercent=80
;
; ;[Map.0.Zone.33.InheritGlobal]
; ;Water.ClarityPercent=1
;
; -----------------------------------------------------------------------
; NOTES
; -----------------------------------------------------------------------
; Press F12 in the game to apply your edits. F7 saves the overlay's own
; changes into this same file.
;
; F7 REWRITES this file whenever it saves a category, and the section it
; writes is regenerated from its key/value pairs - comments inside that
; section are lost. Keep notes above the first section header.
;
; A key with an empty value ("Key=") counts as absent, so it falls back to
; the next scope up.
