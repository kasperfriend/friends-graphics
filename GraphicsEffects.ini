; Live graphics tuning for the TEST client.
; Save this file, focus the game and press F12. No restart is required.
; F11 still toggles the complete graphics package.
; F8 is reserved for the unfinished AI Materials development path.
; F7 opens the in-game grouped tuning overlay.

[AIMaterials]
; Experimental placeholder. AI Materials are not implemented as a supported
; release feature yet. Keep this disabled; F8 is reserved for development.
Enabled=0
; Normal map relief strength (90 is the strong cobblestone baseline matching the approved overhead look).
NormalStrengthPercent=90
; Parallax Occlusion Mapping depth (0 fully disables displacement; 35 = 0.035).
; Displacement fades before grazing angles so it cannot detach from the flat terrain silhouette.
ParallaxDepthPercent=35
; Directional height-field self-shadowing strength (0 really disables it; 75 = 0.75, max 150).
SelfShadowStrength=90
; Developer-only on-screen status overlay (AIMAT ON / AIMAT OFF).
ShowStatus=0

[ShadowDiagnostics]
; Round 6 read-only native-shadow discovery. It never replays a draw and never
; changes render output. Candidate state is written to NativeShadowDiagnostics.log.
Enabled=0
LogConstants=1
; Developer-only: show the four native cascades in the upper-right corner.
PreviewEnabled=0
SummaryIntervalFrames=300
MaxUniqueCandidates=256

[NativeShadows]
; Scales WoW's own verified Poisson-PCF sample radius. 100 is the native game
; kernel; higher values soften the edge without replaying geometry or adding a
; screen-space shadow pass. Only confirmed four-cascade receiver shaders are touched.
Enabled=1
SoftnessPercent=145
; Scales the native max-darkening constant (100 = native, shadows never go
; below 70% brightness). Disassembly-verified on 4 confirmed receiver
; shaders only, not the whole receiver family.
StrengthPercent=100

[Atmosphere]
; --- Cinematic atmosphere ---
; Quality: 0=LOW (quarter, 12 samples), 1=HIGH (quarter, 16 samples),
; 2=ULTRA (half, 24 samples). Samples concentrate near the ground volume.
DirectionalVolumetricEnabled=1
AtmosphereQuality=1
AtmosphereTemporalEnabled=1
AtmosphereTemporalPercent=88
AtmosphereMaxDistance=520
AerialStartDistance=35
AerialDensityPermille=2
HeightDensityPermille=5
HeightFalloffPermille=55
FogBaseOffset=-6
GroundMistOffset=-3
GroundMistDensityPermille=9
GroundMistFalloffPermille=420
AtmosphereNoisePercent=22
AtmosphereExtinctionPercent=100
MoonVolumetricStrengthPercent=16
; How strongly the atmosphere replaces the scene behind it vs letting it
; show through. This is the live "FOG WASH" slider now - not the legacy
; FogWashPercent below, which belongs to the retired full-res shader.
AtmosphereWashPercent=55
; Developer view: 0 final, 1 optical depth, 2 transmission, 3 total density,
; 4 height, 5 mist, 6 noise, 7 ambient, 8 celestial, 9 raw, 10 temporal,
; 11 upsampled.
AtmosphereDebugMode=0

; --- Secondary Sun Radial Glare (around visible disc) ---
SunGlareEnabled=1
SunGlareStrengthPercent=15

; Profiling
CpuProfilingEnabled=0
GpuProfilingEnabled=0

; Temporal accumulation is optional. Keeping it off avoids horizon trails/artifacts.
TemporalShaftsEnabled=1
; Overall ray brightness. Useful range: 50-300.
ShaftPercent=160
SunGlowPercent=80
; Moon rays use the same atmospheric pass but are this fraction of sunlight.
MoonShaftPercent=35
; Width of the three depth samples used to soften canopy edges, in pixels.
ShaftSoftnessPixels=6
; Higher values shorten/dim rays away from the sun. Useful range: 100-350.
ShaftFalloffPercent=125
; DEBUG fallback only - the sun/moon screen position is computed from the
; real light direction + projection matrices, not from these. Leave at
; neutral (100/0/0). Turn on DebugCelestialMarker below to verify the
; projection lands on the real disc before ever touching these.
SunVerticalProjectionPercent=100
SunOffsetXPercent=0
SunOffsetYPercent=0
; Draws a crosshair at the exact screen position rays/glare use as the
; celestial source. Use this to confirm source tracking, not the offsets above.
DebugCelestialMarker=0
; Adds two more crosshairs (GREEN=sun candidate, CYAN=moon candidate) read
; from client-process globals per src/Diagnostics/CelestialMemoryProbe.h.
; Read-only, never affects rendering. The addresses/sun-moon selection are an
; UNVERIFIED hypothesis derived from external reverse engineering of a
; third-party mod (CoAVolFog) - this exists to prove or disprove them, and
; also writes CelestialProbe.log with the raw values for later analysis.
DebugCelestialMemoryProbe=0
; Tints the F9-found candidate draw (fixed-function, zero-translation VIEW =
; skybox trick, large-scale WORLD billboard - see CelestialHighlight.h) magenta,
; live, in-game. If it lands on the real sun/moon disc, confirmed; if not, not.
DebugCelestialCandidateHighlight=0
; Set to 1 temporarily to display the raw shaft mask in black and white.
ShaftDebugMask=0
; Rays require genuinely bright sky. Raise this to suppress them in dark zones.
SunSourceThresholdPercent=50
; Warm screen-space scatter from fires, torches and lanterns.
LocalLightPercent=0
LocalLightThresholdPercent=25
LocalLightRadiusPixels=140
LocalLightDebugMask=0
; User-facing overall medium density. It scales aerial haze, height fog and
; mist together; the layer-specific values above remain advanced tuning.
DensityPermille=5
; Legacy full-resolution fog parameters retained only for old debug shaders.
; The production atmosphere does not consume absolute BaseHeight,
; GroundMistHeight, or FogWashPercent.
; How strongly fog replaces local texture colour. Lower preserves contrast.
FogWashPercent=35
; World height of the low fog layer for the current area.
BaseHeight=28
; Cloud-like density contrast and low-layer contribution.
VariationPercent=135
LowLayerPercent=40
; Legacy ground-mist height for the retired full-resolution path only.
; The production pass uses the single GroundMistOffset/Density/Falloff set
; above (with terrain-relative height); do not define those keys twice.
GroundMistHeight=4

[AmbientOcclusion]
; Screen-space ambient occlusion from the captured scene depth. It seats
; objects on the ground, deepens creases, corners and cavities, and never
; touches sky, water or the user interface. Runs inside the atmosphere
; composite, so it needs [Volume] Enabled=1 in ModernWoWRenderer.ini.
Enabled=1
; Occlusion darkness. 100 would take a fully enclosed point to black; the
; shipped 60 keeps AO a grounding cue instead of grime. Useful range: 30-90.
StrengthPercent=60
; Hemisphere radius in world units (~yards). 1 is the measured sweet spot:
; open floors, open wall faces and open tops read exactly 1.0 (no dark halo
; anywhere), a right-angled corner still reaches 0.66. Raising it reaches
; further into architecture but starts darkening whole open surfaces - 1.5
; already puts a 10% shadow on an open box top. Authored range: 1-6.
RadiusUnits=1
; AO fades out between 55% and 100% of this view distance; beyond it the
; pass is skipped entirely. Keeps distant, reconstruction-noisy terrain clean.
DistanceFadeUnits=250
; Developer-only: overlay the blurred occlusion term instead of applying it.
DebugMask=0

[Wind]
; Shared internal wind; no wind particles or world-space visual effect.
; Direction is the compass bearing the wind comes FROM in WoW axes
; (+X north, +Y west, +Z up): 0=N, 1=NE, 2=E, 3=SE, 4=S, 5=SW, 6=W, 7=NW.
; Dynamic chooses eight-way targets and smoothly turns between them.
; Off keeps legacy authored water/cloud motion. See docs/wind-system.md.
Enabled=1
Dynamic=1
Direction=1
; 100 = reference breeze (12 world yards/s); 0 = calm even during weather.
; Time/weather can raise the live strength to 300%. The authored range is 0..200.
StrengthPercent=100
GustPercent=35
GustSeconds=18
DirectionChangeSeconds=120
TransitionSeconds=30
; Native rain/snow/sand increases wind; clearing eases it down. 0 ignores
; weather. This is an intensity response, not a server-side storm forecast.
WeatherResponsePercent=100
; Disabling a link restores that effect's legacy controls, without resetting
; wind. Cloud/water render toggles do not stop the shared simulation.
AffectWaves=1
AffectClouds=1
; Optional text HUD only: current/target heading, strength, velocity, weather.
DebugView=0

[VolumetricClouds]
; Raymarched volumetric clouds at a fixed world altitude. The visible deck
; stays between BaseAltitude and BaseAltitude + Thickness, independent of
; camera position or view direction, so you can fly through and above it.
; Clouds, ground shadows and sun rays share the same evolving field.
;
; The three noise fields are generated once on first use (about a second)
; and cached in CloudFields.cache next to the dll; delete that file to
; regenerate them.
Enabled=1
; Apply authored biome factors from EnvironmentProfiles.ini (verified locations).
ZoneClouds=1
; Native rain/snow/sand closes the weather-map coverage window toward overcast.
; Independent of the precipitation replacement toggle. Default intensity=100
; means full overcast; lower WeatherVisuals intensity scales this response.
WeatherClouds=1
; Independent shape evolution (0 freezes evolution, but wind still drifts).
EvolutionPercent=100
; Approximate 95% settling time for zone/manual shape edits (0..60 seconds, 0 = immediate).
; Native weather builds over ~18 seconds and clears over ~35 seconds.
TransitionSeconds=12
; 0=LOW (48 steps), 1=MEDIUM (64), 2=HIGH (96), 3=ULTRA (128).
; This controls the march samples, light samples and step size together.
; Old SampleCount/LightSampleCount/BaseStep keys are ignored: they used to
; pin the F7 quality slider to HIGH even when another preset was selected.
Quality=2
; Independent cloud buffer width/height percentage (20..100).
; Changing quality never changes this resolution; lower is faster.
ResolutionPercent=25
; Sunlight scattered through gaps in the moving deck into the atmosphere.
; The SUN RAYS master toggle also controls these rays.
SunRaysEnabled=1
SunRayPercent=80
; Baseline coverage before biome factors. 0 clears fair weather, 85+ closes
; it over. Detected weather can still fill a zero-coverage sky; use Enabled=0
; to disable all clouds, or WeatherClouds=0 for strictly manual coverage.
CoveragePercent=50
; Optical thickness of the cloud material itself (10..400).
DensityPercent=100
; Which way the vertical profile leans: -100 flattens everything into
; stratus sheets, 0 is cumulus, +100 builds towering cumulonimbus.
CloudTypePercent=0
; Fixed visible layer in world units: absolute base Z and thickness.
; BaseAltitude is NOT an offset above the player or local terrain.
; PlanetRadius is retained for legacy shadows, not the visible cloud height.
PlanetRadius=42000
BaseAltitude=850
Thickness=2150
; World size of one tile of each noise field: the base shape, the erosion
; detail, and the weather map that decides where clouds are at all.
; ShapeAspect is how many times the base shape repeats vertically per
; horizontal tile - above ~150 the billows squash into flat lozenges.
FeatureSize=3000
ShapeAspectPercent=130
DetailSize=240
WeatherSize=34000
; How strongly the high-frequency volume erodes the silhouette into wisps
; and cauliflower billows (0..90).
DetailPercent=88
; WindSpeed is cloud drift in world yards/s at 100% shared wind (0..400).
; Shared [Wind] owns direction and modulates speed/shear when linked.
; Optional legacy WindAngle (-180..180) is used only if shared wind or its
; cloud link is off; absent that key, legacy sampling defaults to 25 degrees.
WindSpeed=26
WindShearPercent=22
; Lighting response. Absorption is the self-shadowing strength along the
; light march; the three multi-scatter values are the octave scalars that
; keep a thick cloud from turning into a black cut-out.
AbsorptionPercent=38
SunIntensityPercent=130
AmbientPercent=105
MoonStrengthPercent=30
MultiScatterAttenuationPercent=60
MultiScatterContributionPercent=92
MultiScatterEccentricityPercent=55
; Phase function: the forward lobe lights the deck up when you look into
; the sun, the backward lobe keeps the anti-solar side from going flat,
; the silver lining is the bright rim on a backlit edge, and powder is the
; dark edge that pure Beer absorption cannot reproduce.
ForwardScatterPercent=78
BackwardScatterPercent=32
SilverLiningPercent=55
PowderPercent=70
; March shape: quality owns the sample counts and base step; the step
; grows with distance instead of dividing the span. Jitter trades banding
; for dither.
StepGrowthPermille=10
CoarseStepScale=3
JitterPercent=25
; Width of the fade band just above the horizon (in thousandths), and how
; far the march follows the layer before it stops, in world units.
HorizonFadePermille=18
MaxDistance=26000
; How much of the sky's own haze a cloud picks up with distance (0..100).
; 0 makes every cloud equally contrasty no matter how far away it is,
; which is the loudest tell that a sky is rendered rather than photographed.
AerialPerspectivePercent=60
; Cloud shadows on the world below: strength, and the size of the square
; of world the shadow map covers around the camera. The map holds the
; deck's own shape projected along the sunlight, so the ground under a
; cloud is dimmed and open ground beside it is not. Receivers are projected
; onto a fixed world plane using their own height, so moving the camera
; neither dims nor brightens the world.
; GroundShadowPercent is how much of the light a solidly covered column
; removes; it is the only control on how dark the shadows are (the cloud
; density slider no longer doubles as one).
GroundShadows=1
GroundShadowPercent=55
GroundShadowExtent=24000
; Developer view: 0 final, 1 raw raymarch buffer, 2 coverage, 3 direct
; light, 4 the ground shadow map.
DebugMode=0

[LocalFog]
; Separate low world-space volume integrated into the atmosphere raymarch.
; World-space flow and rolling/eroding height slices animate even at rest.
; Player motion adds only a local wake. Depth and water boundaries still apply.
Enabled=1
DensityPermille=12
; Actual vertical thickness in world units. Larger means taller fog banks.
HeightUnits=3
; Layer base relative to terrain (world units); negative lowers it into ground.
; Missing terrain coverage blends to the tracked ground height, not zero fog.
BaseOffset=-1
WakeStrengthPercent=85
WakeRadius=5
TrailLength=18

[Water]
; The live master switch also used by F7; no separate startup water gate.
; Independent water feature switches. Geometry waves lift and slide the surface itself
; (Gerstner), which is what makes a wave read as a body of water rather than as a curve
; drawn on a flat plane; the shading keeps working without them, on a calm sheet.
Enabled=1
WavesEnabled=1
GeometryWavesEnabled=1
ReflectionsEnabled=1
RefractionEnabled=1
DepthEnabled=1
FoamEnabled=1
SunGlintEnabled=1
; UV displacement, perturbed normal and specular highlight (tuned for smooth, deep water).
RipplePermille=18
NormalPercent=28
SpecularPercent=115
; Size of one ripple lattice cell, in percent of the shipped 2.5 world units, and
; how fast that detail fades once one pixel spans more than a cell. The wave field
; is anchored to the terrain instead of to a liquid tile, so these are the only
; two knobs for wave size and the pattern no longer restarts at tile edges.
WaveScalePercent=100
WaveSofteningPercent=100
; Per-body look, authored the way the reference renderer does it: how far light
; reaches, how much sea state the wind allows, and how tight each fleck on the sun road
; is. ClarityPercent 200 is a clear mountain lake, 5 is swamp soup; SparklePercent 200
; makes the glitter a field of small hard flecks, 25 turns it into a broad sheen.
; WindStrengthPercent is the per-body foam/wind bias: 0 suppresses wind-driven
; crest/shoal foam, 200 is a blown-out coast. Shared strength lives in [Wind].
; All three, and the three colours below, can be overridden per area in
; LocationGraphics.ini, so Darkshore and the Barrens do not share a look.
ClarityPercent=100
WindStrengthPercent=100
SparklePercent=100
; Roughness of the reflection on a choppy surface, and the floor it cannot go below.
WaveRoughnessPercent=100
SheenPercent=50
; Foam that appears where the bottom comes up fast, and how bright all foam is.
ShoalFoamPercent=100
FoamBrightnessPercent=100
; 0xRRGGBB. WaterColour multiplies the zone's own painted water (0x808080 neutral);
; DeepColour is what the column converges to; AbsorptionColour is the per-channel rate
; at which light dies (a red-heavy value kills red first, which is why deep water is
; teal). SunDiscPercent is the brightness of the sun/moon mirrored on the surface.
; Zones with their own colours in EnvironmentProfiles.ini (azure Booty Bay, dark
; Duskwood, icy Winterspring...) use those instead of these three; a per-location
; colour in LocationGraphics.ini still wins over both.
WaterColour=0x808080
DeepColour=0x0E2A28
AbsorptionColour=0xFF8C6B
SunDiscPercent=40
; How hard shared wind affects this body's wave energy: 0 keeps authored
; swell even in calm air, 100 follows wind, 200 doubles departure from baseline.
; Actual wind always gates wind-driven foam, even with this at 0. Wave
; direction still follows shared wind. Unlinked water uses this as its direct
; native-weather response. It never counts the storm twice; zone exposure
; (WaterAgitationMultiplier) remains in force.
WeatherResponsePercent=100
; Seconds to about 95% of a new sea state. A squall takes this long to arrive;
; clearing takes twice as long, so open water drains instead of snapping flat.
WeatherEaseSeconds=14
; 0 pins every zone to the global numbers above (the pre-zone behaviour), 1 lets
; each map/zone/area raise or calm its own water through EnvironmentProfiles.ini.
ZoneWaves=1
; Wave travel speed and counter-current spread. The zone sea state and shared
; wind (native weather when unlinked) affect FUTURE phase speed, not the
; accumulated session age. F12 reloads both without jumping existing crests.
FlowSpeedPercent=100
FlowRotationPercent=32
; Actual SSR hit strength and fallback sky/environment reflection.
ReflectionPercent=80
EnvironmentPercent=45
; SSR ray reach in view-space units and accepted hit thickness.
ReflectionDistance=120
ReflectionThicknessPercent=350
; Shallow distortion, depth tint and foam where water meets geometry.
RefractionPercent=14
DepthAbsorptionPercent=38
ShoreFoamPercent=28
ShoreFoamWidthPercent=120
; Forever-inspired long normals, solar glitter and squared Fresnel response.
SwellPercent=55
SunGlintPercent=160
FresnelPercent=100
CrestFoamPercent=20
; Wave height, in percent of the shipped sea: 0 is a flat sheet, 100 the reference look,
; 300 a gale. It scales the real amplitude in world yards together with the wave size
; above and with the zone's own sea state, and the crest steepness is clamped on the CPU
; so no combination of the three can fold a wave over itself.
GeometryWavePercent=100
WaterDebugMode=0

[PostProcess]
; Master switch for the fullscreen image pass. Keep off for maximum FPS.
Enabled=0
; Brightness offset: -50 to +50 percent (0 is default)
BrightnessPercent=0
; Contrast: 50 to 180 percent (100 is default)
ContrastPercent=100
; Gamma: 50 to 180 percent (100 is default)
GammaPercent=100
; Sharpness: 0 to 100 percent (35 is recommended for crisp textures)
SharpnessPercent=35

[DistanceFog]
; The game's OWN native distance fog (rescales its real per-shader fog
; constants). Reset to neutral (100/100 = pass-through): the atmosphere's
; WOW FOG BASELINE now reads this same native fog directly (read-only,
; before this rescale runs) to set its own distance/colour, so rescaling
; it here just makes native-shaded objects disagree with what the
; atmosphere is doing on top of them.
Enabled=1
DistancePercent=100
PowerPercent=100

[WeatherVisuals]
; Native world-space particle replacement and a light depth-aware continuity
; layer, drawn before UI. Weather detection survives F7/Alt+Tab gaps.
; This toggles only added weather RENDERING, not the native observation that
; feeds clouds, wind and waves. F10 also toggles only rendering at runtime.
Enabled=1
; The obsolete Mode hint is ignored: forcing only the continuity layer to
; rain/snow while native particles, clouds and the sea saw another type broke
; visual consistency. All consumers now follow the detected native type.
; Common native-weather intensity (0..300%). Scales replacement rain/snow,
; cloud overcast and wind/sea storm response. Detection still works with the
; rendering toggle or F10 off; 0 suppresses added precipitation and response.
IntensityPercent=100
; Continuity-layer fall speed (10..400%); edits affect future motion only.
RainSpeedPercent=120
; The camera-relative gap-filling rain/snow/sand layer follows [Wind].
; Old WindStrengthPercent/WindAngle keys here are ignored; native particles
; retain the game's own motion. [Wind] Enabled=0 removes added drift.
; Depth occlusion: prevents rain and snow from passing through roofs, bridges and awnings
DepthOcclusion=1
; Camera lens droplets: screen-space refraction of sliding droplets when outdoors in rain
LensDroplets=1
; Lens droplet refraction strength (0..200%)
LensDropletStrength=60
; Strength of the continuity layer's subtle rain/snow mist (not the
; independent volumetric atmosphere's fog density).
AtmosphereHazePercent=120
; Developer-only on-screen status indicator (RAIN ON / SNOW ON / WEATHER OFF)
ShowStatus=0
[DynamicLighting]
Enabled=1
IntensityPercent=100
RayPercent=75
Quality=1
; How wide a window the light pool reads the depth buffer with, as a percent of
; its shipped width. The window is what decides how smooth the pool looks: a
; wider one averages more ground and reads as flat, a narrower one follows the
; terrain's own bumps and can go grainy at a distance. Lower it for a sharper,
; more detailed pool, raise it if a pool still shimmers on rough ground.
NormalSpreadPercent=100
DebugMode=0
