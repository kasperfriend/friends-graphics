; Modern WoW Renderer runtime switches.
; F11 toggles the complete graphics package, F7 opens tuning, F12 reloads
; GraphicsEffects.ini. Visual tuning lives in GraphicsEffects.ini.
[Graphics]
UnifiedToggle=1
Enabled=1
ShowStatus=0

; Fog, rays and clouds are configured ONLY in GraphicsEffects.ini [Atmosphere]
; and [VolumetricClouds]. The obsolete flat [Atmosphere] overlay was removed;
; old FogOpacity/FogHeight/SunX etc. values here were never used by the live pass.

; Water draw capture: F8 captures one frame when enabled. F12 reloads this
; section. AutoCapture=1 arms one frame on startup or F12 (use F12 in-world).
; Status and file errors are recorded in WaterEffect.log.
[Diagnostics]
Enabled=0
AutoCapture=0
MaxDraws=2048
SkipDraws=0

; F9 captures every draw call for ONE frame to CelestialDiagnostics/<timestamp>/
; celestial_candidates.txt, flagging small/alpha-blended/no-zwrite draws as
; CANDIDATE=1 (a filter to make the log readable, not a verdict) and dumping
; VS/PS bytecode for those. Off by default; read-only, no rendering changes.
[CelestialDiagnostics]
Enabled=0

[Highlight]
Enabled=0
Group1PixelShader=ebecd65635a1a75e

[Water]
; Live enable lives in GraphicsEffects.ini / F7, not in this startup file.
ShowStatus=0

[DistanceFog]
; Diagnostic status only. GraphicsEffects.ini [DistanceFog] / F7 owns the
; live enable and scaling for both the volumetric edge and native fallback.
ShowStatus=0

[Volume]
Enabled=1
