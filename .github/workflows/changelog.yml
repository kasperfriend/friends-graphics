name: changelog
# Checks the changelog.d/ fragment files with the shared rules (https://github.com/Corfirean/coa-server-build/blob/main/changelog/GUIDE.md).
on:
  push:
    branches: [main]
    paths: ['changelog.d/**', '.github/workflows/changelog.yml']
  pull_request:
    branches: [main]
    paths: ['changelog.d/**', '.github/workflows/changelog.yml']

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: Corfirean/coa-server-build/.github/workflows/changelog-check.yml@main
