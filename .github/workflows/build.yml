name: Build

# Continuous integration for the proxy DLL. This workflow only builds and
# checks the tree - publishing a GitHub Release is a separate, manual
# workflow (.github/workflows/release.yml) so that pushing to main never
# creates a release by itself.
on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:
  # Called by the manual release workflow so a release always ships exactly
  # the binaries this CI produced, from the same steps.
  workflow_call:
    inputs:
      configurations:
        description: JSON array of MSBuild configurations to build.
        type: string
        default: '["Debug","Release"]'
      artifact-name:
        description: Name of the uploaded Release package artifact.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Win32 ${{ matrix.configuration }}
    # windows-2025-vs2026 carries the VS 2026 (v145) toolset this solution
    # targets. Forks or self-hosted setups can point CI at another image by
    # defining the WINDOWS_RUNNER repository variable; the toolset is then
    # detected below instead of being hard-coded.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2025-vs2026' }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.configurations || '["Debug","Release"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSBuild and build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $installPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -property installationPath

          if (-not $installPath) {
            throw "Visual Studio / MSBuild not found"
          }

          $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"
          Write-Host "Using MSBuild: $msbuild"

          # The solution asks for v145 (VS 2026). Fall back to the newest
          # toolset the runner actually has so a different Windows image
          # still produces a build instead of an unresolved-toolset error.
          $toolsRoot = Join-Path $installPath "VC\Tools\MSVC"
          $toolset = "v145"
          if (Test-Path $toolsRoot) {
            $versions = Get-ChildItem $toolsRoot -Directory | Sort-Object Name -Descending
            Write-Host "Installed MSVC toolsets: $($versions.Name -join ', ')"
            if (-not ($versions.Name | Where-Object { $_ -like "14.5*" })) {
              $toolset = if ($versions.Name | Where-Object { $_ -like "14.4*" }) { "v143" } else { "v142" }
            }
          }
          Write-Host "Using PlatformToolset: $toolset"

          & $msbuild "ModernWoWRenderer.sln" `
            /m `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="Win32" `
            /p:PlatformToolset="$toolset" `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Water device regressions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $output = & cmd.exe /c tools\Test-Water.cmd 2>&1
          $result = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Output $text
          # Preserve compiler/GPU diagnostics in API-readable annotations too.
          $flat = ($text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
          if ($result -ne 0) {
            Write-Output "::error title=Water regression failed::$flat"
            exit $result
          }
          Write-Output "::notice title=Water regression results::$flat"

      - name: Weather motion regressions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $output = & cmd.exe /c tools\Test-Weather.cmd 2>&1
          $result = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Output $text
          # Preserve compiler/GPU diagnostics in API-readable annotations too.
          $flat = ($text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
          if ($result -ne 0) {
            Write-Output "::error title=Weather regression failed::$flat"
            exit $result
          }
          Write-Output "::notice title=Weather regression results::$flat"

      - name: Verify output
        shell: pwsh
        run: |
          $dir = "build\${{ matrix.configuration }}"
          $required = @(
            "$dir\d3d9.dll",
            "$dir\ModernWoWRenderer.ini",
            "$dir\GraphicsEffects.ini",
            "$dir\EnvironmentProfiles.ini",
            "$dir\data\areas.txt"
          )

          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Expected build output is missing: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Prepare release package
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $source = "build\Release"
          $package = "package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item "$source\d3d9.dll" $package
          Copy-Item "$source\ModernWoWRenderer.ini" $package
          Copy-Item "$source\GraphicsEffects.ini" $package
          Copy-Item "$source\EnvironmentProfiles.ini" $package
          Copy-Item "$source\data" $package -Recurse

          $materialCache = Join-Path $package "MaterialCache"
          New-Item -ItemType Directory -Force -Path $materialCache | Out-Null
          Copy-Item "$source\MaterialCache\local_light_manifest.json" $materialCache
          Copy-Item "$source\MaterialCache\LocalLightReview.json" $materialCache
          if (Test-Path "$source\textures") {
            Copy-Item "$source\textures" $package -Recurse
          }

      - name: Upload Release build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || format('modern-wow-renderer-win32-{0}', github.sha) }}
          path: package/
          if-no-files-found: error
          retention-days: 14

  shaders:
    name: Validate HLSL
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2025-vs2026' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile embedded shaders with fxc
        shell: pwsh
        run: ./tools/ValidateShaders.ps1

  cloud-regression:
    name: Cloud climate and continuity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and run portable cloud regressions
        run: |
          mkdir -p build
          g++ -O2 -std=c++20 -pthread tools/CloudClimateRegression.cpp src/Environment/EnvironmentProfile.cpp src/Environment/EnvironmentDatabase.cpp -o build/cloud-climate-test
          ./build/cloud-climate-test
          g++ -O2 -std=c++20 -pthread tools/CloudLayerRegression.cpp -o build/cloud-layer-test
          ./build/cloud-layer-test
          g++ -O2 -std=c++20 tools/FrameClockRegression.cpp -o build/frame-clock-test
          ./build/frame-clock-test
          g++ -O2 -std=c++20 -Wall -Wextra -Werror tools/WaterRegression.cpp -o build/water-test
          ./build/water-test
