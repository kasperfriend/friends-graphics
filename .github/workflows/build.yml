name: Build

# Continuous integration for the proxy DLL. This workflow only builds and
# checks the tree - publishing a GitHub Release is a separate, manual
# workflow (.github/workflows/release.yml) so that pushing to main never
# creates a release by itself.
on:
  push:
    branches:
      - main
  # PR updates already cover feature-branch commits; do not also build their pushes.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: Also build Debug (Release and its artifact are always produced).
        type: boolean
        default: false
  # Called by the manual release workflow so a release always ships exactly
  # the binaries this CI produced, from the same steps.
  workflow_call:
    inputs:
      configurations:
        description: JSON array of MSBuild configurations to build (include Release for an artifact).
        type: string
        default: '["Release"]'
      artifact-name:
        description: Name of the uploaded Release package artifact.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Win32 ${{ matrix.configuration }}
    # windows-2025-vs2026 carries the VS 2026 (v145) toolset this solution
    # targets. Forks or self-hosted setups can point CI at another image by
    # defining the WINDOWS_RUNNER repository variable; the toolset is then
    # detected below instead of being hard-coded.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2025-vs2026' }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.configurations || (inputs.debug && '["Debug","Release"]' || '["Release"]')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSBuild and build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $installPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -property installationPath

          if (-not $installPath) {
            throw "Visual Studio / MSBuild not found"
          }

          $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"
          Write-Host "Using MSBuild: $msbuild"

          # The solution asks for v145 (VS 2026). Fall back to the newest
          # toolset the runner actually has so a different Windows image
          # still produces a build instead of an unresolved-toolset error.
          $toolsRoot = Join-Path $installPath "VC\Tools\MSVC"
          $toolset = "v145"
          if (Test-Path $toolsRoot) {
            $versions = Get-ChildItem $toolsRoot -Directory | Sort-Object Name -Descending
            Write-Host "Installed MSVC toolsets: $($versions.Name -join ', ')"
            if (-not ($versions.Name | Where-Object { $_ -like "14.5*" })) {
              $toolset = if ($versions.Name | Where-Object { $_ -like "14.4*" }) { "v143" } else { "v142" }
            }
          }
          Write-Host "Using PlatformToolset: $toolset"

          $log = Join-Path $env:RUNNER_TEMP "msbuild.log"
          & $msbuild "ModernWoWRenderer.sln" `
            /m `
            /p:Configuration="${{ matrix.configuration }}" `
            /p:Platform="Win32" `
            /p:PlatformToolset="$toolset" `
            /verbosity:minimal 2>&1 | Tee-Object -FilePath $log | Out-Host

          if ($LASTEXITCODE -ne 0) {
            # The job log is a download; an annotation is readable from the Checks API, so a
            # build failure says what failed without anyone opening the artifact.
            Get-Content $log | Select-String -Pattern 'error [A-Z]+[0-9]+|fatal error|Unresolved external' |
                Select-Object -First 10 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit $LASTEXITCODE
          }

      # Shader strings are compiled at runtime, not by MSBuild. Validate them
      # once on the existing Windows runner instead of starting a separate job.
      - name: Validate HLSL
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./tools/ValidateShaders.ps1

      - name: Water device regressions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $output = & cmd.exe /c tools\Test-Water.cmd 2>&1
          $result = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Output $text
          # Preserve compiler/GPU diagnostics in API-readable annotations too.
          # GitHub truncates annotation messages at 4096 characters. Sending the full output
          # makes the compile banner the entire annotation and hides the failing check,
          # so annotations carry the tail - where the failure lives - while the complete
          # output stays in the step log above.
          $tail = (($text -split "`r?`n") | Select-Object -Last 40) -join "`n"
          $flat = ($tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
          if ($result -ne 0) {
            Write-Output "::error title=Water regression failed::$flat"
            exit $result
          }
          Write-Output "::notice title=Water regression results::$flat"
          # Keep the safety sweep readable even when the full annotation is
          # truncated by GitHub (the complete output remains in the job log).
          $sweep = ($output | Where-Object { "$_" -match 'sweep:|sRGB refraction|Water GPU regressions|SKIP GPU' }) -join "`n"
          $sweep = $sweep -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
          Write-Output "::notice title=Water safety sweep::$sweep"

      - name: Wind simulation and settings regressions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $output = & cmd.exe /c tools\Test-Wind.cmd 2>&1
          if ($LASTEXITCODE -ne 0) {
            # The suite's own last lines are the diagnosis, and stderr does not
            # survive into a runner's job log tail: say them as annotations too.
            $failed = ($output | Select-Object -Last 6) -join ' | '
            $failed = $failed -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Wind regressions failed::$failed"
            $output | Write-Output
            exit $LASTEXITCODE
          }
          # The suite's own PASS lines are the evidence a report is read for: the
          # crossing gate's real-file checks run nowhere else.
          $passed = ($output | Where-Object { $_ -match '^PASS ' }) -join '; '
          $passed = $passed -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
          Write-Output "::notice title=Wind regressions::$passed"

      - name: F7 overlay state regressions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          & cmd.exe /c tools\Test-OverlayState.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: F7 overlay device regressions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $output = & cmd.exe /c tools\Test-Overlay.cmd 2>&1
          $result = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Output $text
          # GitHub truncates annotation messages at 4096 characters. Sending the full output
          # makes the compile banner the entire annotation and hides the failing check,
          # so annotations carry the tail - where the failure lives - while the complete
          # output stays in the step log above.
          $tail = (($text -split "`r?`n") | Select-Object -Last 40) -join "`n"
          $flat = ($tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
          if ($result -ne 0) {
            Write-Output "::error title=F7 overlay device regression failed::$flat"
            exit $result
          }
          Write-Output "::notice title=F7 overlay device regression results::$flat"

      - name: Environment and all-zone read regressions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $output = & cmd.exe /c tools\Test-Environment.cmd 2>&1
          $result = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Output $text
          # GitHub truncates annotation messages at 4096 characters. Sending the full output
          # makes the compile banner the entire annotation and hides the failing check,
          # so annotations carry the tail - where the failure lives - while the complete
          # output stays in the step log above.
          $tail = (($text -split "`r?`n") | Select-Object -Last 40) -join "`n"
          $flat = ($tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
          if ($result -ne 0) {
            Write-Output "::error title=Environment regression failed::$flat"
            exit $result
          }
          Write-Output "::notice title=Environment regression results::$flat"

      # The zone-crossing settings cache, against a reference that re-parses the
      # files on every call. This suite was written with the crossing fix and never
      # wired into CI, so the fix it guards ran nowhere: it needs the real profile
      # API, which only a Windows runner has.
      - name: Location tuning cache regressions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $output = & cmd.exe /c tools\Test-LocationTuningCache.cmd 2>&1
          $result = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Output $text
          # GitHub truncates annotation messages at 4096 characters, so the tail -
          # where the failure lives - is the annotation and the step log keeps all
          # of it, including the measured sweep timings.
          $tail = (($text -split "`r?`n") | Select-Object -Last 40) -join "`n"
          $flat = ($tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
          if ($result -ne 0) {
            Write-Output "::error title=Location tuning cache regression failed::$flat"
            exit $result
          }
          Write-Output "::notice title=Location tuning cache regression results::$flat"

      - name: Weather motion regressions
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $output = & cmd.exe /c tools\Test-Weather.cmd 2>&1
          $result = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Output $text
          # Preserve compiler/GPU diagnostics in API-readable annotations too.
          # GitHub truncates annotation messages at 4096 characters. Sending the full output
          # makes the compile banner the entire annotation and hides the failing check,
          # so annotations carry the tail - where the failure lives - while the complete
          # output stays in the step log above.
          $tail = (($text -split "`r?`n") | Select-Object -Last 40) -join "`n"
          $flat = ($tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
          if ($result -ne 0) {
            Write-Output "::error title=Weather regression failed::$flat"
            exit $result
          }
          Write-Output "::notice title=Weather regression results::$flat"

      - name: Verify output
        shell: pwsh
        run: |
          $dir = "build\${{ matrix.configuration }}"
          $required = @(
            "$dir\d3d9.dll",
            "$dir\ModernWoWRenderer.ini",
            "$dir\GraphicsEffects.ini",
            "$dir\EnvironmentProfiles.ini",
            "$dir\data\areas.txt"
          )

          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Expected build output is missing: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Prepare release package
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $source = "build\Release"
          $package = "package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item "$source\d3d9.dll" $package
          Copy-Item "$source\ModernWoWRenderer.ini" $package
          Copy-Item "$source\GraphicsEffects.ini" $package
          Copy-Item "$source\EnvironmentProfiles.ini" $package
          Copy-Item "$source\data" $package -Recurse

          $materialCache = Join-Path $package "MaterialCache"
          New-Item -ItemType Directory -Force -Path $materialCache | Out-Null
          Copy-Item "$source\MaterialCache\local_light_manifest.json" $materialCache
          Copy-Item "$source\MaterialCache\LocalLightReview.json" $materialCache
          if (Test-Path "$source\textures") {
            Copy-Item "$source\textures" $package -Recurse
          }

      - name: Upload Release build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || format('modern-wow-renderer-win32-{0}', github.sha) }}
          path: package/
          if-no-files-found: error
          retention-days: 14

  regressions:
    name: Portable regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cloud, timing and device regressions
        run: |
          mkdir -p build
          python3 tools/GenerateWaterZoneAudit.py --check
          g++ -O2 -std=c++20 -pthread tools/CloudClimateRegression.cpp src/Environment/EnvironmentProfile.cpp src/Environment/EnvironmentDatabase.cpp -o build/cloud-climate-test
          ./build/cloud-climate-test
          g++ -O2 -std=c++20 -pthread tools/CloudLayerRegression.cpp -o build/cloud-layer-test
          ./build/cloud-layer-test
          g++ -O2 -std=c++20 -Wall -Wextra -Werror -pedantic tools/WindRegression.cpp -o build/wind-test
          ./build/wind-test
          g++ -O2 -std=c++20 tools/FrameClockRegression.cpp -o build/frame-clock-test
          ./build/frame-clock-test
          g++ -O2 -std=c++20 -Wall -Wextra -Werror tools/WaterRegression.cpp -o build/water-test
          ./build/water-test
          g++ -O2 -std=c++20 -Wall -Wextra -Werror tools/DeviceHealthRegression.cpp -o build/device-health-test
          ./build/device-health-test

      # Ambient occlusion sees only a depth buffer and a camera, so the whole
      # shipped look - open surfaces untouched, contacts and corners darkened,
      # fade with distance, blur not crossing edges - is checkable on the CPU.
      - name: Ambient occlusion regressions
        run: |
          mkdir -p build
          g++ -O2 -std=c++20 -Wall -Wextra -Werror -pedantic tools/AmbientOcclusionRegression.cpp -o build/ambient-occlusion-test
          ./build/ambient-occlusion-test

      # The shader text is only compiled on the Windows runner, so the GLSL
      # spellings fxc rejects are checked here, where a shader change can be
      # tested before it is pushed.
      - name: Embedded shader source regressions
        run: |
          mkdir -p build
          g++ -O2 -std=c++20 -Wall -Wextra -Werror tools/ShaderSourceRegression.cpp -o build/shader-source-test
          ./build/shader-source-test

      # "Location unavailable" is the one F7 line a player reads without a log, so the
      # cause text, the "never sampled" ids and the rule that a rejected profile file must
      # still configure the provider are pinned here - all of it compiles without windows.h.
      - name: Location diagnosis regressions
        run: |
          mkdir -p build
          g++ -O2 -std=c++20 -Wall -Wextra -Werror tools/LocationStatusRegression.cpp -o build/location-status-test
          ./build/location-status-test

      # The shared diagnostic sink: what it buffers, when it opens a file, and what
      # rotation does to the file the README tells a supporter to look for. Every
      # diagnostic write in the renderer goes through this now, so its behaviour is
      # pinned rather than assumed.
      - name: Diagnostic file sink regressions
        run: |
          mkdir -p build
          g++ -O2 -std=c++20 -Wall -Wextra -Werror -pedantic -Itools/fixtures \
            tools/FileSinkRegression.cpp -o build/filesink-test
          ./build/filesink-test

      # The settings cache the crossing fix rests on, against a reference that
      # re-parses the files on every call. The Windows job runs the same source
      # against the real profile API; this runs it on every commit against the
      # shim's independent one, so the parser's rules are checked twice and the
      # suite does not depend on the Release matrix to run at all.
      - name: Location tuning cache regressions (portable)
        run: |
          mkdir -p build
          g++ -O2 -std=c++20 -Wall -Wextra -Itools/fixtures \
            tools/LocationTuningCacheRegression.cpp tools/LocationTuningCacheOtherTu.cpp \
            -o build/location-tuning-cache-test
          ./build/location-tuning-cache-test

      # What ONE zone/area crossing costs, and how that cost moves as a player
      # accumulates per-zone and per-area settings. This runs the production
      # settings cache against the Linux shim's independent profile API, so it is
      # both a differential test of the parser the cache now does itself and the
      # only place the crossing budgets are measured on every commit.
      - name: Zone crossing cost regressions
        run: |
          mkdir -p build
          g++ -O2 -std=c++20 -Wall -Wextra -Werror -pedantic -Itools/fixtures \
            tools/LocationTuningCrossingRegression.cpp -o build/crossing-test
          ./build/crossing-test
          # The fingerprint walks pointers into the materialised section maps, so
          # the same suite runs under the sanitizers too. The absolute millisecond
          # budgets step aside there - they are about a frame, and an instrumented
          # build is not one.
          g++ -std=c++20 -g -Wall -Wextra -Werror -pedantic -Itools/fixtures \
            -fsanitize=address,undefined \
            tools/LocationTuningCrossingRegression.cpp -o build/crossing-test-asan
          ./build/crossing-test-asan

      - name: Build and run portable overlay regressions
        run: |
          mkdir -p build
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -g tools/OverlayLayoutRegression.cpp -o build/overlay-test
          ./build/overlay-test
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -g tools/TrackedRenderStateRegression.cpp -o build/tracked-state-test
          ./build/tracked-state-test
