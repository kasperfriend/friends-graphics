[Default]
; Water inherits a neutral sea state and each zone raises or calms it with
; WaterAgitationMultiplier: 1.0 is the shipped global waves, below 1 is
; sheltered water, above 1 is an exposed coast. It is a multiplier on the wave
; amplitude and on how much foam and motion the same waves carry, so an authored
; WIND of 0 stays foamless in any weather. Interiors and cities sit low, open
; seas sit high, and unknown zones keep this value. Weather lands on top of it
; through WeatherIntensityMultiplier above, which is deliberate: a zone that damps
; storms also damps what those storms do to its water.
; WaterColour/DeepColour/AbsorptionColour (0xRRGGBB) are a zone's own water
; colours, written next to its WaterAgitationMultiplier: azure in Booty Bay
; ([Area.35], which overrides its Stranglethorn zone), darker greens in
; Duskwood, the Plaguelands and Felwood, icy blues in Winterspring and
; Icecrown. They replace the global [Water] colours from GraphicsEffects.ini
; for that place; a colour set per-location in LocationGraphics.ini still wins.
; A zone with no colour lines keeps the global colours untouched. Leave the
; three lines out here in [Default] on purpose: the global file owns the base.
; WaterClarityMultiplier scales the player's [Water] WaterClarity for that body
; (above 1 is gin-clear snowmelt, below 1 is a marsh you cannot see your feet
; in). UnderwaterTurbidity/Caustic/Shaft/GlowMultiplier scale the matching
; [Underwater] player dials, so a zone authors how dirty and luminous its medium
; is without taking the player's own settings away. Zones with authored colours
; also carry a swept set of these five dials; the absorption colour is the hue a
; deep column keeps, so green, red and arcane waters stay their colour below.
WaterAgitationMultiplier=1.0
WaterClarityMultiplier=1.0
UnderwaterTurbidityMultiplier=1.0
UnderwaterCausticMultiplier=1.0
UnderwaterShaftMultiplier=1.0
UnderwaterGlowMultiplier=1.0
FogDensityMultiplier=1.0
LocalFogMultiplier=1.0
AtmosphereMultiplier=1.0
RayIntensityMultiplier=1.0
LightingMultiplier=1.0
WeatherIntensityMultiplier=1.0
DistanceFogPowerMultiplier=1.0

[Environment.ForestSunny]
FogDensityMultiplier=0.8
RayIntensityMultiplier=1.2
LocalFogMultiplier=0.7

[Environment.DarkForest]
FogDensityMultiplier=1.4
RayIntensityMultiplier=0.45
LocalFogMultiplier=1.5

[Environment.Desert]
FogDensityMultiplier=0.55
RayIntensityMultiplier=1.1
LocalFogMultiplier=0.15

[Environment.Snow]
