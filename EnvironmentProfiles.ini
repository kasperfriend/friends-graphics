[EnvironmentSystem]
Enabled=1
TransitionSeconds=4.0
AreaDebounceMs=300
Debug=0

; Leave blank to auto-detect the bundled, exact-hash verified Ascension build.
; Other builds require researched RVAs and live verification; never guess them.
[LocationProvider]
ExeSHA256=
MapRva=0
ZoneRva=0
AreaRva=0
VerifiedInWorld=0

[Default]
FogDensityMultiplier=1.0
LocalFogMultiplier=1.0
AtmosphereMultiplier=1.0
RayIntensityMultiplier=1.0
LightingMultiplier=1.0
WeatherIntensityMultiplier=1.0
DistanceFogPowerMultiplier=1.0

[Environment.ForestSunny]
FogDensityMultiplier=0.8
RayIntensityMultiplier=1.2
LocalFogMultiplier=0.7

[Environment.DarkForest]
FogDensityMultiplier=1.4
RayIntensityMultiplier=0.45
LocalFogMultiplier=1.5

[Environment.Desert]
FogDensityMultiplier=0.55
RayIntensityMultiplier=1.1
LocalFogMultiplier=0.15

[Environment.Snow]
FogDensityMultiplier=0.9
RayIntensityMultiplier=0.85

; Cloud climate: factors applied to GraphicsEffects / LocationGraphics cloud
; settings, then blended by the cloud controller. These profiles ONLY alter
; clouds; existing fog/light presets above remain opt-in. Unknown/custom zones
; inherit Default (or Map), and Area overrides still have final precedence.
; Coverage 0..2, type offset -1..1, feature/thickness .25..4,
; detail 0..2, evolution 0..4. Disable ZoneClouds for a purely manual sky.


[Environment.CloudFair]
CloudCoverageMultiplier=0.9
CloudTypeOffset=0.15
CloudFeatureSizeMultiplier=0.75
CloudThicknessMultiplier=0.8
CloudDetailMultiplier=1
CloudEvolutionMultiplier=1

[Environment.CloudArid]
CloudCoverageMultiplier=0.4
CloudTypeOffset=-0.25
CloudFeatureSizeMultiplier=0.65
CloudThicknessMultiplier=0.55
CloudDetailMultiplier=1
CloudEvolutionMultiplier=0.7

[Environment.CloudDark]
CloudCoverageMultiplier=1.45
CloudTypeOffset=-0.7
CloudFeatureSizeMultiplier=1.4
CloudThicknessMultiplier=0.8
CloudDetailMultiplier=0.7
CloudEvolutionMultiplier=0.65

[Environment.CloudCoastal]
CloudCoverageMultiplier=1.25
CloudTypeOffset=-0.8
CloudFeatureSizeMultiplier=1.6
CloudThicknessMultiplier=0.7
CloudDetailMultiplier=0.72
CloudEvolutionMultiplier=0.8

[Environment.CloudCold]
CloudCoverageMultiplier=1.05
CloudTypeOffset=-0.45
CloudFeatureSizeMultiplier=1.2
CloudThicknessMultiplier=0.85
CloudDetailMultiplier=0.82
CloudEvolutionMultiplier=0.65

[Environment.CloudMountain]
CloudCoverageMultiplier=1.2
CloudTypeOffset=0.55
CloudFeatureSizeMultiplier=1.05
CloudThicknessMultiplier=1.4
CloudDetailMultiplier=0.88
CloudEvolutionMultiplier=0.8

[Environment.CloudLush]
CloudCoverageMultiplier=1.15
CloudTypeOffset=0.55
CloudFeatureSizeMultiplier=0.9
CloudThicknessMultiplier=1.2
CloudDetailMultiplier=0.95
CloudEvolutionMultiplier=1.1

[Environment.CloudOpen]
CloudCoverageMultiplier=0
CloudTypeOffset=0
CloudFeatureSizeMultiplier=1
CloudThicknessMultiplier=1
CloudDetailMultiplier=1
CloudEvolutionMultiplier=0.6

